name: Sync Liga Privada (cada 4h)

on:
  schedule:
    # Desfasado respecto a scraper.yml (minuto 7) para no competir por
    # runners en el mismo instante.
    - cron: '22 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # laliga_auth.py refresca el access_token a partir de un refresh_token
      # guardado como secret -- NUNCA hace login interactivo aqui (no hay
      # pantalla en el runner). Si el refresh_token caduca o es revocado,
      # este paso seguira escribiendo el fichero pero los scripts de abajo
      # fallaran con un error claro ("invalid_grant") en vez de colgarse --
      # entonces hay que repetir el login local (python laliga_auth.py) y
      # actualizar el secret LALIGA_TOKENS_JSON con:
      #   gh secret set LALIGA_TOKENS_JSON --repo uabtoni/fantasy < laliga_tokens.json
      - name: Preparar credenciales de LaLiga Fantasy
        env:
          LALIGA_TOKENS_JSON: ${{ secrets.LALIGA_TOKENS_JSON }}
        run: printf '%s' "$LALIGA_TOKENS_JSON" > laliga_tokens.json

      - name: Sincronizar mercado de la liga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_league_market.py

      - name: Sincronizar plantillas de la liga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_league_roster.py

      # Ademas de sincronizar, manda un aviso por Telegram con TODOS los
      # movimientos nuevos del historial (fichajes, ventas, cláusulas,
      # blindajes, ganancias por jornada, altas de manager...) -- sin
      # filtrar por importe ni tipo, a peticion del usuario (23/08/2026).
      # Si no hay movimientos nuevos desde la pasada anterior, no manda nada.
      - name: Sincronizar historial y finanzas de la liga (+ aviso de movimientos por Telegram)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sync_league_activity.py

      - name: Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>Falló la sincronización de la liga privada</b> (mercado/plantillas/historial) — revisa los logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Si el motivo es 'invalid_grant', hay que repetir el login local y actualizar el secret LALIGA_TOKENS_JSON."
