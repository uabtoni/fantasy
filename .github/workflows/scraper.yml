name: Scraper Fantasy (cada 4h)

on:
  schedule:
    # Cron en UTC. "7 */4 * * *" = a las 00:07, 04:07, 08:07, 12:07,
    # 16:07 y 20:07 UTC. Se dispara en el minuto 7 (no en punto) a
    # propósito: GitHub avisa de que los workflows programados pueden
    # retrasarse mucho más si se lanzan justo al inicio de cada hora,
    # que es cuando más carga tienen sus servidores.
    - cron: '7 */4 * * *'
  # Te permite también lanzarlo a mano desde la pestaña "Actions" de GitHub,
  # útil para probar sin esperar a la siguiente ejecución programada.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Instalar navegador Chromium para Playwright
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar el scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python futbolfantasy_scraper.py

      - name: Enviar alertas de Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_alert.py
